<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        すいれん館 ライブラリー
        {% endblock %}
    </title>
  
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>


<body>

    <script>
        if (localStorage.getItem("theme") === "light") {
            document.body.classList.add("light-theme");
        }
    </script>

    <!-- ==============================
         メインコンテンツ
    ============================== -->

    <main class="main-content">

        {% block content %}
        <!-- それぞれのページの内容が入る -->
        {% endblock %}

    </main>


    <!-- ==============================
         下部固定ナビゲーション
    ============================== -->

    <nav class="bottom-nav">

        <a href="{{ url_for('index') }}" class="nav-item">
            <span class="nav-icon">⌂</span>
            <span class="nav-label">HOME</span>
        </a>

        <!-- フッターナビを一般ユーザーと管理者ユーザーで分ける -->
        {% if session.get("role") == "admin" %}

        <a href="{{ url_for('admin') }}" class="nav-item">
            <span class="nav-icon">⚙</span>
            <span class="nav-label">管理画面</span>
        </a>

        {% else %}

        <a href="{{ url_for('mypage') }}" class="nav-item">
            <span class="nav-icon">♡</span>
            <span class="nav-label">マイページ</span>
        </a>

        {% endif %}

        <a href="{{ url_for('search') }}" class="nav-item">
            <span class="nav-icon">⌕</span>
            <span class="nav-label">検索</span>
        </a>

    </nav>


    <!-- 各ページ固有のJavaScript用 -->

    {% block script %}
    {% endblock %}

</body>

</html>
